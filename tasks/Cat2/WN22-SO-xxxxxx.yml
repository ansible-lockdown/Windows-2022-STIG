- name: "MEDIUM | WN22-SO-000100 | PATCH | Windows Server 2022 maximum age for machine account passwords must be configured to 30 days or less."
  when: wn22_so_000100 | bool
  tags:
    - WN22-SO-000100
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-254454r991589_rule
    - V-254454
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  block:
    - name: "MEDIUM | WN22-SO-000100 | AUDIT | Windows Server 2022 maximum age for machine account passwords must be configured to 30 days or less. | Number Of Days Check."
      when: win22stig_machineaccountpassword_max_age > 30 or win22stig_machineaccountpassword_max_age == 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have not set the right number of days for win22stig_machineaccountpassword_max_age"
          - "Please read the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN22-SO-000100 | AUDIT | Windows Server 2022 maximum age for machine account passwords must be configured to 30 days or less. | Warn Count."
      when: win22stig_machineaccountpassword_max_age > 30 or win22stig_machineaccountpassword_max_age == 0
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN22-SO-000100"

    - name: "MEDIUM | WN22-SO-000100 | PATCH | Windows Server 2022 maximum age for machine account passwords must be configured to 30 days or less. | Apply Variable."
      when:
        - win22stig_machineaccountpassword_max_age <= 30
        - win22stig_machineaccountpassword_max_age != 0
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        state: present
        value: MaximumPasswordAge
        data: "{{ win22stig_machineaccountpassword_max_age }}"
        datatype: dword

