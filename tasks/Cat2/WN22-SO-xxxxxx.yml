- name: "MEDIUM | WN22-SO-000120 | PATCH | Windows Server 2022 machine inactivity limit must be set to 15 minutes or less, locking the system with the screen saver."
  when: wn22_so_000120 | bool
  tags:
    - WN22-SO-000120
    - CAT2
    - CCI-000056
    - CCI-000057
