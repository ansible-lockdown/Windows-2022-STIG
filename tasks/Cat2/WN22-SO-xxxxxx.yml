- name: "MEDIUM | WN22-SO-000400 | PATCH | Windows Server 2022 User Account Control must, at a minimum, prompt administrators for consent on the secure desktop."
  when: wn22_so_000400 | bool
  tags:
    - WN22-SO-000400
    - CAT2
    - CCI-001084
    - SRG-OS-000134-GPOS-00068
    - SV-254484r958518_rule
    - V-254484
    - NIST800-53_SC-3
    - NIST800-53_A_SC-3_1_ii
    - NIST800-53_4_SC-3
  block:
    - name: "MEDIUM | WN22-SO-000400 | PATCH | Windows Server 2022 User Account Control must, at a minimum, prompt administrators for consent on the secure desktop. | Variable Check."
      when: win22stig_consentprompt < 1 or win22stig_consentprompt > 2
      ansible.builtin.debug:
        msg:
          - "Warning!! You have not chosen the correct setting for win22stig_consentprompt"
          - "Please read the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN22-SO-000400 | PATCH | Windows Server 2022 User Account Control must, at a minimum, prompt administrators for consent on the secure desktop. | Warn Count."
      when: win22stig_consentprompt < 1 or win22stig_consentprompt > 2
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN22-SO-000400"

    - name: "MEDIUM | WN22-SO-000400 | PATCH | Windows Server 2022 User Account Control must, at a minimum, prompt administrators for consent on the secure desktop. | Apply Variable."
      when: win22stig_consentprompt == 1 or win22stig_consentprompt == 2
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        state: present
        value: ConsentPromptBehaviorAdmin
        data: "{{ win22stig_consentprompt }}"
        datatype: dword

