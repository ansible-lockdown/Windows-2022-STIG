  block:
    - name: "MEDIUM | WN22-SO-000120 | AUDIT | Windows Server 2022 machine inactivity limit must be set to 15 minutes or less, locking the system with the screen saver. | Number Of Seconds Check."
      when: win22stig_inactivitytimeoutsecs > 900 or win22stig_inactivitytimeoutsecs == 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have not set the right number of seconds for win22stig_inactivitytimeoutsecs"
          - "Please read the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN22-SO-000120 | AUDIT | Windows Server 2022 machine inactivity limit must be set to 15 minutes or less, locking the system with the screen saver. | Warn Count."
      when: win22stig_inactivitytimeoutsecs > 900 or win22stig_inactivitytimeoutsecs == 0
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN22-SO-000120"

    - name: "MEDIUM | WN22-SO-000120 | PATCH | Windows Server 2022 machine inactivity limit must be set to 15 minutes or less, locking the system with the screen saver. | Apply Variable."
      when:
        - win22stig_inactivitytimeoutsecs <= 900
        - win22stig_inactivitytimeoutsecs != 0
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        state: present
        value: InactivityTimeoutSecs
        data: "{{ win22stig_inactivitytimeoutsecs }}"
        datatype: dword

