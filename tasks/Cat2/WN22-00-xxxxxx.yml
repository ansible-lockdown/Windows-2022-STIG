- name: "MEDIUM | WN22-00-000240 | PATCH | Windows Server 2022 must have software certificate installation files removed."
  when:
    - wn22_00_000240 | bool
    - win22stig_lengthy_search | bool
  tags:
    - WN22-00-000240
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-254261r1210262_rule
    - V-254261
    - audit
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  block:
    - name: "MEDIUM | WN22-00-000240 | AUDIT | Windows Server 2022 must have software certificate installation files removed. | Search for files"
      ansible.windows.win_find:
        paths: '{{ item }}:\'
        patterns: ["*.p12", "*.pfx"]
        recurse: true
        hidden: true
      register: discovered_00_000240_files
      with_items: "{{ prelim_drive_letters.stdout_lines | default([], true) }}"

    - name: "MEDIUM | WN22-00-000240 | PATCH | Windows Server 2022 must have software certificate installation files removed. | Remove Files"
      when:
        - win22stig_disruption_high | bool
        - (discovered_00_000240_files.results | default([], true) | first | default({}, true)).files | length > 0
      ansible.windows.win_file:
        path: "{{ item.path }}"
        state: absent
      with_items:
        - "{{ (discovered_00_000240_files.results | default([], true) | first | default({}, true)).files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: "MEDIUM | WN22-00-000240 | AUDIT | Windows Server 2022 must have software certificate installation files removed. | Alert on files if not Disruptive High"
      when:
        - not win22stig_disruption_high | bool
        - (discovered_00_000240_files.results | default([], true) | first | default({}, true)).files | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have .p12 and/or .pfx files on your system"
          - "Please review and remove the following files manually.  If you"
          - "would like them removed with automation set win22stig_disruption_high: true"
          - "Any files not removed must be documented with the ISSO."
          - "{{ (discovered_00_000240_files.results | default([], true) | first | default({}, true)).files | map(attribute='path') | list }}"

    - name: "MEDIUM | WN22-00-000240 | AUDIT | Windows Server 2022 must have software certificate installation files removed. | Warn Count."
      when:
        - not win22stig_disruption_high | bool
        - (discovered_00_000240_files.results | default([], true) | first | default({}, true)).files | length > 0
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN22-00-000240"

