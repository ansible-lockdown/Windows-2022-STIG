- name: "MEDIUM | WN22-00-000090 | AUDIT | Windows Server 2022 systems must have a Trusted Platform Module (TPM) enabled and ready for use."
  when: wn22_00_000090 | bool
  tags:
    - WN22-00-000090
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-254246r1210256_rule
    - V-254246
    - NIST800-53_4_CM-6_b
    - NIST800-53_A_CM-6_1_iv
  block:
    # wmic is deprecated and is a Feature-on-Demand that can be absent, in which case the register
    # carries no stdout/stderr keys and every downstream conditional raises
    # "dict object has no attribute stderr_lines". This uses CIM instead.
    - name: "MEDIUM | WN22-00-000090 | AUDIT | Windows Server 2022 systems must have a Trusted Platform Module (TPM) enabled and ready for use. | Get TPM Settings"
      ansible.windows.win_shell: |
        $tpm = Get-CimInstance -Namespace root\cimv2\security\microsofttpm -ClassName Win32_Tpm -ErrorAction SilentlyContinue
        if ($null -eq $tpm) { "No Instance" }
        else { "IsActivated=$($tpm.IsActivated_InitialValue) IsEnabled=$($tpm.IsEnabled_InitialValue) IsOwned=$($tpm.IsOwned_InitialValue) SpecVersion=$($tpm.SpecVersion)" }
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000090_tpm_status

    - name: "MEDIUM | WN22-00-000090 | AUDIT | Windows Server 2022 systems must have a Trusted Platform Module (TPM) enabled and ready for use. | Running Instances Check."
      when: "'No Instance' in discovered_00_000090_tpm_status.stdout | default('', true)"
      ansible.builtin.debug:
        msg:
          - "Warning!! Please confirm TPM status is Ready for use, there are no instances currently running."

    # Warns when the TPM is NOT compliant. The previous conditions tested for the healthy values
    # being present, so the warning fired on a good TPM and stayed silent on a broken one. They
    # also read stderr_lines, where wmic writes nothing but its "No Instance(s)" diagnostic, and
    # the SpecVersion clause read "'SpecVersion=2' or '...' in ..." - a non-empty string is always
    # truthy, so that disjunct was unconditionally true.
    - name: "MEDIUM | WN22-00-000090 | AUDIT | Windows Server 2022 systems must have a Trusted Platform Module (TPM) enabled and ready for use. | Full TPM Check."
      when:
        - "'No Instance' not in discovered_00_000090_tpm_status.stdout | default('', true)"
        - "'IsActivated=True' not in discovered_00_000090_tpm_status.stdout | default('', true) or
           'IsEnabled=True' not in discovered_00_000090_tpm_status.stdout | default('', true) or
           'IsOwned=True' not in discovered_00_000090_tpm_status.stdout | default('', true)"
      ansible.builtin.debug:
        msg:
          - "Warning!! Please confirm TPM status is Ready for use. Current settings do not meet STIG requirements."
          - "{{ discovered_00_000090_tpm_status.stdout | default('', true) | trim }}"

    - name: "MEDIUM | WN22-00-000090 | AUDIT | Windows Server 2022 systems must have a Trusted Platform Module (TPM) enabled and ready for use. | Warning Count"
      when: "'No Instance' in discovered_00_000090_tpm_status.stdout | default('', true) or
             'IsActivated=True' not in discovered_00_000090_tpm_status.stdout | default('', true) or
             'IsEnabled=True' not in discovered_00_000090_tpm_status.stdout | default('', true) or
             'IsOwned=True' not in discovered_00_000090_tpm_status.stdout | default('', true)"
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN22-00-000090"

