  block:
    - name: "MEDIUM | WN22-CC-000270 | PATCH | Windows Server 2022 Application event log size must be configured to 32768 KB or greater. | Warning Message."
      when: win22stig_application_event_log_max_size < 32768
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid file size set for win22stig_application_event_log_max_size please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN22-CC-000270 | PATCH | Windows Server 2022 Application event log size must be configured to 32768 KB or greater. | Warn Count."
