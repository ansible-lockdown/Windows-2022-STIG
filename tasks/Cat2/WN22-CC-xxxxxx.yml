      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN22-CC-000270"

    - name: "MEDIUM | WN22-CC-000270 | PATCH | Windows Server 2022 Application event log size must be configured to 32768 KB or greater. | Apply Log Size"
