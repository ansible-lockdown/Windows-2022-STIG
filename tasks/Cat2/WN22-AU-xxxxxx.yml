- name: "MEDIUM | WN22-AU-000010 | AUDIT | Windows Server 2022 audit records must be backed up to a different system or media than the system being audited."
  when: wn22_au_000010 | bool
  tags:
    - WN22-AU-000010
    - CAT2
    - CCI-001851
    - SRG-OS-000342-GPOS-00133
    - SV-254294r958754_rule
    - V-254294
    - NIST800-53_4_AU_4_1
  block:
    - name: "MEDIUM | WN22-AU-000010 | AUDIT | Windows Server 2022 audit records must be backed up to a different system or media than the system being audited."
      ansible.builtin.debug:
        msg:
          - "Warning!! This is a manual task. Windows Server 2022 audit records must be backed up to a"
          - "different system or media than the system being audited. Establish and implement a process"
          - "for backing up log data to another system or media other than the system being audited."

    - name: "MEDIUM | WN22-AU-000010 | AUDIT | Windows Server 2022 audit records must be backed up to a different system or media than the system being audited. | import reusable task."
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN22-AU-000010"

