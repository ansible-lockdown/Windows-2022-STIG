- name: "MEDIUM | WN22-AU-000060 | AUDIT | Windows Server 2022 Event Viewer must be protected from unauthorized modification and deletion."
  when: wn22_au_000060 | bool
  tags:
    - WN22-AU-000060
    - CAT2
    - CCI-001494
    - CCI-001495
    - SRG-OS-000257-GPOS-00098
    - SV-254299r991558_rule
    - V-254299
    - audit
    - NIST800-53_AU_9
    - NIST800-53_A_AU-9_1
    - NIST800-53_4_AU-9
  block:
    - name: "MEDIUM | WN22-AU-000060 | AUDIT | Event Viewer must be protected from unauthorized modification and deletion. | Get Current Permissions For Eventvwr.exe."
      ansible.windows.win_shell: get-acl {{ item }}:\Windows\system32\Eventvwr.exe | FL AccessToString
      changed_when: false
      failed_when: false
      with_items:
        - "{{ prelim_drive_letters.stdout_lines | default([], true) }}"
      check_mode: false
      register: discovered_au_000060_event_viewer_permissions

    - name: "MEDIUM | WN22-AU-000060 | AUDIT | Event Viewer must be protected from unauthorized modification and deletion. | Permissions warning for accounts."
      ansible.builtin.debug:
        msg:
          - "Warning!! Event Viewer must be protected from unauthorized modification and deletion."
          - "If any groups or accounts other than TrustedInstaller have Full control or Modify permissions, this is a finding."
          - "TrustedInstaller - Full Control, Administrators, SYSTEM, Users, ALL APPLICATION PACKAGES,"
          - "ALL RESTRICTED APPLICATION PACKAGES - Read & Execute"
          - "If there is no output below If the location of the logs has been changed"
          - "The default location should be System32 folder."
          - "{{ (discovered_au_000060_event_viewer_permissions.results | default([], true) | first | default({}, true)).stdout_lines }}"

    - name: "MEDIUM | WN22-AU-000060 | AUDIT | Windows Server 2022 Event Viewer must be protected from unauthorized modification and deletion. | import reusable task."
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN22-AU-000060"

- name: "MEDIUM | WN22-AU-000070 | PATCH | Windows Server 2022 must be configured to audit Account Logon | Credential Validation successes."
  when: wn22_au_000070 | bool
  tags:
    - WN22-AU-000070
    - CAT2
    - CCI-000172
    - SRG-OS-000470-GPOS-00214
    - SV-254300r991578_rule
    - V-254300
    - audit
    - NIST800-53_AU_12_c
    - NIST800-53_A_AU-12_1_iv
    - NIST800-53_4_AU-12_c
  block:
    - name: "MEDIUM | WN22-AU-000070 | AUDIT | Windows Server 2022 must be configured to audit Account Logon | Credential Validation successes."
      ansible.windows.win_shell: AuditPol /get /subcategory:"Credential Validation" -r | ConvertFrom-Csv | Select-Object -expand "Inclusion Setting"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_au_000070_audit

    - name: "MEDIUM | WN22-AU-000070 | PATCH | Windows Server 2022 must be configured to audit Account Logon | Credential Validation successes."
      when: "'Success' not in discovered_au_000070_audit.stdout"
      ansible.windows.win_shell: AuditPol /set /subcategory:"Credential Validation" /success:enable

