- name: "MEDIUM | WN22-DC-000120 | AUDIT | Windows Server 2022 data files owned by users must be on a different logical partition from the directory server data files."
  when:
    - wn22_dc_000120 | bool
    - "'controller' in ansible_facts['windows_domain_role']"
  tags:
    - WN22-DC-000120
    - CAT2
    - CCI-001090
    - SRG-OS-000138-GPOS-00069
    - SV-254396r1137695_rule
    - V-254396
    - audit
    - NIST800-53_SC-4
    - NIST800-53_A_SC-4_1
    - NIST800-53_4_SC-4
  block:
    - name: "MEDIUM | WN22-DC-000120 | AUDIT | Data files owned by users must be on a different logical partition from the directory server data files. | Audit Current Dir Locations For DSA"
      ansible.windows.win_shell: Get-ItemProperty Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters -Name "Database log files path","DSA Database file"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_dc_000120_audit_dirlocation

    - name: "MEDIUM | WN22-DC-000120 | AUDIT | Data files owned by users must be on a different logical partition from the directory server data files. | Get Shared Drives"
      ansible.windows.win_shell: net share
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_dc_000120_audit_shares

    - name: "MEDIUM | WN22-DC-000120 | AUDIT | Data files owned by users must be on a different logical partition from the directory server data files. | Warning Message."
      ansible.builtin.debug:
        msg:
          - "Warning!! This is a manual task. Data files owned by users must be on a different logical partition"
          - "from the directory server data files. Ignore system shares (e.g., NETLOGON, SYSVOL, and administrative"
          - "shares ending in $). User shares that are hidden (ending with $) should not be ignored."
          - "If user shares are located on the same logical partition as the directory server data files, this is a finding."
          - "Note the directory locations in the values for the DSA Database file"
          - "{{ discovered_dc_000120_audit_dirlocation.stdout_lines | trim }}"
          - "Note the logical drive(s) or file system partition for any organization-created data shares."
          - "{{ discovered_dc_000120_audit_shares.stdout_lines | trim }}"

    - name: "MEDIUM | WN22-DC-000120 | AUDIT | Windows Server 2022 data files owned by users must be on a different logical partition from the directory server data files. | import reusable task."
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN22-DC-000120"

