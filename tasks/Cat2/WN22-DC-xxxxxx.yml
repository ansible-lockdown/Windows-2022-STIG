- name: "MEDIUM | WN22-DC-000430 | AUDIT | The password for the krbtgt account on a domain must be reset at least every 180 days."
  when:
    - wn22_dc_000430 | bool
    - "'controller' in ansible_facts['windows_domain_role']"
    - win22stig_complexity_high | bool
  tags:
    - WN22-DC-000430
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-254427r991589_rule
    - V-254427
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  block:
    - name: "MEDIUM | WN22-DC-000430 | AUDIT | The password for the krbtgt account on a domain must be reset at least every 180 days."
      when: win22stig_krbtgt_account_pass_age <= 180
      ansible.windows.win_shell: "Get-ADUser krbtgt -Property PasswordLastSet | Where-Object {$_.PasswordLastSet -lt ((Get-Date).AddDays(-{{ win22stig_krbtgt_account_pass_age }}))} | Select-Object -ExpandProperty PasswordLastSet"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_dc_000430_audit

    - name: "MEDIUM | WN22-DC-000430 | AUDIT | The password for the krbtgt account on a domain must be reset at least every 180 days. | Warning Message Variable."
      when: win22stig_krbtgt_account_pass_age > 180
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid number of days set for win22stig_krbtgt_account_pass_age please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN22-DC-000430 | AUDIT | The password for the krbtgt account on a domain must be reset at least every 180 days. | Warning Message Account."
      when:
        - win22stig_krbtgt_account_pass_age <= 180
        - discovered_dc_000430_audit.stdout | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! The password for the krbtgt account on a domain must be reset at least every 180 days."
          - "Your password is currently out of STIG compliance and has not been reset in the last 180 days."
          - "{{ discovered_dc_000430_audit.stdout_lines | trim }}"

    - name: "MEDIUM | WN22-DC-000430 | AUDIT | The password for the krbtgt account on a domain must be reset at least every 180 days. | import reusable task."
      when:
        - win22stig_krbtgt_account_pass_age <= 180
        - discovered_dc_000430_audit.stdout | length > 0 or
          win22stig_krbtgt_account_pass_age > 180
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN22-DC-000430"
