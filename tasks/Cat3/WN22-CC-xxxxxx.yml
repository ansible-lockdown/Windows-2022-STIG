---

- name: "LOW | WN22-CC-000030 | PATCH | Windows Server 2022 Internet Protocol version 6 (IPv6) source routing must be configured to the highest protection level to prevent IP source routing."
  when: wn22_cc_000030 | bool
  tags:
    - WN22-CC-000030
    - CAT3
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-254335r991589_rule
    - V-254335
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters
    value: DisableIPSourceRouting
    data: 2
    datatype: dword

- name: "LOW | WN22-CC-000040 | PATCH | Windows Server 2022 source routing must be configured to the highest protection level to prevent Internet Protocol (IP) source routing."
  when: wn22_cc_000040 | bool
  tags:
    - WN22-CC-000040
    - CAT3
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-254336r991589_rule
    - V-254336
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters
    value: DisableIPSourceRouting
    data: 2
    datatype: dword

- name: "LOW | WN22-CC-000050 | PATCH | Windows Server 2022 must be configured to prevent Internet Control Message Protocol (ICMP) redirects from overriding Open Shortest Path First (OSPF)-generated routes."
  when: wn22_cc_000050 | bool
  tags:
    - WN22-CC-000050
    - CAT3
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-254337r991589_rule
    - V-254337
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters
    value: EnableICMPRedirect
    data: 0
    datatype: dword

- name: "LOW | WN22-CC-000060 | PATCH | Windows Server 2022 Must be configured to ignore NetBIOS name release requests except from WINS servers."
  when: wn22_cc_000060 | bool
  tags:
    - WN22-CC-000060
    - CAT3
    - CCI-002385
    - SRG-OS-000420-GPOS-00186
    - SV-254338r958902_rule
    - V-254338
    - NIST800-53_4_SC-5
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Netbt\Parameters
    value: NoNameReleaseOnDemand
    data: 1
    datatype: dword

- name: "LOW | WN22-CC-000200 | PATCH | Windows Server 2022 Application Compatibility Program Inventory must be prevented from collecting data and sending the information to Microsoft."
  when: wn22_cc_000200 | bool
  tags:
    - WN22-CC-000200
    - CAT3
    - CCI-000381
    - SRG-OS-000095-GPOS-00049
    - SV-254351r958478_rule
    - V-254351
    - NIST800-53_CM-7
    - NIST800-53_A_CM-7_1_ii
    - NIST800-53_4_CM-7_a
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat
    value: DisableInventory
    data: 1
    datatype: dword

- name: "LOW | WN22-CC-000260 | PATCH | Windows Server 2022 Windows Update must not obtain updates from other PCs on the Internet."
  when: wn22_cc_000260 | bool
  tags:
    - WN22-CC-000260
    - CAT3
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-254357r991589_rule
    - V-254357
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization
    value: DODownloadMode
    data: "{{ win22stig_dodownloadmode }}"
    datatype: dword

- name: "LOW | WN22-CC-000320 | PATCH | Windows Server 2022 turning off File Explorer heap termination on corruption must be disabled."
  when: wn22_cc_000320 | bool
  tags:
    - WN22-CC-000320
    - CAT3
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-254363r991589_rule
    - V-254363
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer
    value: NoHeapTerminationOnCorruption
    state: present
    data: 0
    datatype: dword
