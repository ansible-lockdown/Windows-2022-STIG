---

# tasks file for Windows-2022-STIG

- name: Display Banner
  tags: always
  ansible.builtin.debug:
    msg: "{{ lockdown_banner.split('\n') }}"

- name: Gather Distribution Info
  when: ansible_facts['distribution'] is not defined
  tags: always
  ansible.builtin.setup:
    gather_subset: distribution,!all,!min

- name: Get Windows Installation Type
  tags: always
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion
    name: InstallationType
  register: prelim_get_windows_installation_type

- name: Set Windows Installation Type
  tags: always
  ansible.builtin.set_fact:
    prelim_windows_installation_type: "{{ prelim_get_windows_installation_type.value | default('', true) }}"

# ansible_facts['distribution'] is only populated when the connecting user is an administrator,
# so it is defaulted here and the installation type is checked separately. Server Core is a
# distinct InstallationType literal and must be accepted alongside Server.
- name: Check OS Version and Family
  when: not skip_os_check | bool
  tags: always
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Windows'
      - prelim_windows_installation_type in ['Server', 'Server Core']
      - "'2022' in ansible_facts['distribution'] | default('', true)"
    success_msg: "{{ ansible_facts['distribution'] | default('Windows', true) }} is the detected operating system."
    fail_msg: "This role can only be run against Windows Server 2022 Editions. {{ ansible_facts['distribution'] | default('unknown', true) }} is not supported."

- name: Check Ansible Version
  tags: always
  ansible.builtin.assert:
    that: ansible_version.full is version_compare(min_ansible_version, '>=')
    success_msg: "Ansible version {{ ansible_version.full }} meets the minimum of {{ min_ansible_version }}."
    fail_msg: "You must use Ansible {{ min_ansible_version }} or greater."

- name: Include the Preliminary Tasks
  tags:
    - always
    - prelim_tasks
  ansible.builtin.import_tasks:
    file: prelim.yml

- name: Audit and apply the controls, releasing the user hives whatever the outcome
  # The unload belongs in an always section, not in sequence after the controls. A failing control
  # or a failing scan aborts the remaining tasks, and a plain import would be one of them, leaving
  # the profiles prelim mounted in place until the host reboots.
  #
  # audit_only is the one path this does not cover: it ends the host's run from inside the pre
  # remediation audit, and meta does not unwind through always. That path unloads the hives
  # itself, in audit_only.yml.
  block:
    - name: Run the pre remediation audit
      # Measures the host before anything is applied.
      #
      # Skipped under check mode for the same reason as the post remediation audit below: staging
      # the scanner writes a directory, re-ACLs it and unpacks the bundle onto the target, none of
      # which a --check run may do. Without the guard, win_file reports the working directory
      # created without creating it and the ACL task that follows fails the play on a path that
      # was never made.
      when:
        - run_audit | bool or audit_only | bool
        - not ansible_check_mode
        - "'controller' not in ansible_facts['windows_domain_role'] | default('', true)"
      tags:
        - run_audit
        - audit_only
      ansible.builtin.import_tasks:
        file: pre_remediation_audit.yml

    - name: Stop here when audit_only is set
      # The single exit for audit_only, and it is deliberately gated on nothing else. The scan
      # above is skipped under check mode, on a domain controller, and by a tag filter selecting
      # neither run_audit nor audit_only. When the exit lived inside that import it was skipped
      # with it, and audit_only then fell through into a full CAT I, II and III remediation on a
      # host the operator asked only to measure. Tagged always so no tag filter can drop it.
      when: audit_only | bool
      tags: always
      ansible.builtin.import_tasks:
        file: audit_only.yml

    - name: Include CAT I controls
      when: win22stig_cat1_controls | bool
      tags:
        - CAT1
        - high
      ansible.builtin.import_tasks:
        file: Cat1/main.yml

    - name: Include CAT II controls
      when: win22stig_cat2_controls | bool
      tags:
        - CAT2
        - medium
      ansible.builtin.import_tasks:
        file: Cat2/main.yml

    - name: Include CAT III controls
      when: win22stig_cat3_controls | bool
      tags:
        - CAT3
        - low
      ansible.builtin.import_tasks:
        file: Cat3/main.yml

  always:
    - name: Unload the registry hives loaded by prelim
      # Tagged always so a tag-filtered run that loaded hives still unloads them. The check mode
      # guard lives at the top of unload_hives.yml rather than here, so a future caller cannot
      # omit it.
      when:
        - win22stig_load_user_hives | bool
        - "'controller' not in ansible_facts['windows_domain_role'] | default('', true)"
      tags: always
      ansible.builtin.import_tasks:
        file: unload_hives.yml

- name: Add ansible file showing Benchmark and levels applied
  when: create_benchmark_facts | bool
  tags:
    - always
    - benchmark
  ansible.builtin.import_tasks:
    file: benchmark_facts.yml

- name: Run post tasks
  tags: always
  ansible.builtin.import_tasks:
    file: post.yml

- name: Run the post remediation audit
  when:
    - run_audit | bool
    - not audit_only | bool
    - not ansible_check_mode
    - "'controller' not in ansible_facts['windows_domain_role'] | default('', true)"
  tags: run_audit
  ansible.builtin.import_tasks:
    file: post_remediation_audit.yml

- name: Collect the audit output
  when:
    - fetch_audit_output | bool
    - run_audit | bool
    - not ansible_check_mode
    - "'controller' not in ansible_facts['windows_domain_role'] | default('', true)"
  tags: fetch_audit_output
  ansible.builtin.import_tasks:
    file: fetch_audit_output.yml

- name: Show the audit results
  when: run_audit | bool
  tags: run_audit
  ansible.builtin.debug:
    msg: "{{ audit_results.split('\n') }}"

- name: If Warnings found Output count and control IDs affected
  when: warn_count != 0
  tags: always
  ansible.builtin.debug:
    msg:
      - "You have {{ warn_count }} Warning(s) that require investigation(s). Their ID's are listed below:"
      - "{{ warn_control_list }}"
