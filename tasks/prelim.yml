---

- name: "PRELIM | Gather Windows Domain Facts"
  when: ansible_facts['windows_domain_member'] is not defined
  tags: always
  ansible.builtin.setup:
    gather_subset: windows_domain,!all,!min

- name: "PRELIM | Set Fact If Domain Joined."
  when: ansible_facts['windows_domain_member'] is defined
  tags: always
  ansible.builtin.set_fact:
    discovered_domain_joined: "{{ ansible_facts['windows_domain_member'] }}"

# Every [System Access] control in this role is written with secedit. On a domain joined
# host the Default Domain Policy owns that section and overwrites it at each policy refresh,
# so a local write reverts within roughly two hours while the run still reports success. An
# audit taken straight afterwards therefore reports a compliance that does not last. The
# 13 secedit backed controls are skipped on such a host and the operator is told once.
- name: "PRELIM | Account Policy Scope"
  tags: always
  block:
    - name: "PRELIM | Account Policy Scope | Set fact when account policy is domain scoped"
      when: discovered_domain_joined | bool
      ansible.builtin.set_fact:
        discovered_account_policy_is_domain_scoped: true

    - name: "PRELIM | Account Policy Scope | Warn that account policy is set at the domain"
      when: discovered_account_policy_is_domain_scoped | bool
      ansible.builtin.debug:
        msg:
          - "Warning!! This host is domain joined, so the [System Access] account policy is set"
          - "by the domain rather than locally. The Default Domain Policy overwrites local"
          - "[System Access] at every policy refresh, so anything written here reverts within"
          - "about two hours and an audit run straight afterwards reports a compliance that does"
          - "not last. The 13 secedit backed controls - the account lockout trio and the"
          - "password policy controls - are therefore skipped on this host. Set them in the"
          - "Default Domain Policy instead."

    - name: "PRELIM | Account Policy Scope | Set warning count"
      when: discovered_account_policy_is_domain_scoped | bool
      vars:
        warn_control_id: 'Account policy is domain scoped'
      ansible.builtin.import_tasks:
        file: warning_facts.yml

- name: "PRELIM | Get Drive Letters"
  when: wn22_00_000240 or wn22_au_000060 or wn22_00_000390 or wn22_00_000400
  tags: always
  ansible.windows.win_shell: Get-Volume | ?{ $_.DriveType -eq 'Fixed' } | Select-Object -ExpandProperty 'DriveLetter'
  changed_when: false
  failed_when: false
  check_mode: false
  register: prelim_drive_letters

- name: "PRELIM | Check For SecGuide.admx In PolicyDefinitions"
  when: wn22_00_000390 or wn22_00_000400
  tags: always
  ansible.windows.win_find:
    paths: '{{ item }}:\Windows\PolicyDefinitions'
    patterns: SecGuide.admx
    hidden: true
  changed_when: false
  failed_when: false
  with_items:
    - "{{ prelim_drive_letters.stdout_lines | default([], true) }}"
  register: prelim_secguide_admx_audit

- name: "PRELIM | Check For SecGuide.adml In PolicyDefinitions\\en-US"
  when: wn22_00_000390 or wn22_00_000400
  tags: always
  ansible.windows.win_find:
    paths: '{{ item }}:\Windows\PolicyDefinitions\en-US'
    patterns: SecGuide.adml
    hidden: true
  changed_when: false
  failed_when: false
  with_items:
    - "{{ prelim_drive_letters.stdout_lines | default([], true) }}"
  register: prelim_secguide_adml_audit

# Two controls remove a local account's ability to reach this host over the network, which means
# they sever the run that is applying them.
#
#   WN22-MS-000020  writes LocalAccountTokenFilterPolicy=0, filtering the privileged token of local
#                   accounts on NETWORK logon. WinRM and psrp die; SSH survives, because it does
#                   not take that logon path.
#   WN22-MS-000080  denies network logon to Guests, Enterprise Admins, Domain Admins, Local account
#                   and Local account and member of Administrators group. That removes the network
#                   logon right outright, so WinRM AND SSH both die, because Windows OpenSSH
#                   password authentication uses the same logon path.
#
# Both present misleadingly as "the specified credentials were rejected by the server": the port
# keeps answering and the service keeps running, only authentication is refused. Do not diagnose
# either as a network or service fault. Host proven elsewhere in the Windows Fleet 2026-09-16,
# where every remote transport failed after the equivalent control applied, including SSH public
# key and WinRM certificate authentication, leaving the console as the only way in.
- name: "PRELIM | Control Connection Scope"
  tags: always
  block:
    # A domain principal is either DOMAIN\user or user@realm, so a name carrying neither
    # separator is a local account.
    #
    # The backslash comes from a YAML single quoted variable rather than a Jinja literal on
    # purpose. In a Jinja expression neither a single nor a doubled backslash literal matches one
    # backslash here: the first is a syntax error, the second tests for two. A YAML single quoted
    # scalar takes the character literally and never reaches Jinja's string parser.
    - name: "PRELIM | Control Connection Scope | Detect whether the run connects as a local account"
      vars:
        domain_separator_backslash: '\'
      ansible.builtin.set_fact:
        prelim_control_account_is_local: >-
          {{ domain_separator_backslash not in (ansible_user | default(''))
             and '@' not in (ansible_user | default('')) }}

    # Two facts, because the two controls have different blast radii. WN22-MS-000020 filters the token
    # on NETWORK logon only, so SSH survives it. WN22-MS-000080 removes the network logon right
    # outright, so it severs SSH as well.
    - name: "PRELIM | Control Connection Scope | Detect a local account over a network logon transport"
      ansible.builtin.set_fact:
        prelim_local_account_network_logon: >-
          {{ prelim_control_account_is_local | bool
             and (ansible_connection | default('ssh')) not in ['ssh', 'smart'] }}

    - name: "PRELIM | Control Connection Scope | Warn that WN22-MS-000020 is skipped to keep the connection"
      when:
        - prelim_local_account_network_logon | bool
        - ansible_facts['windows_domain_role'] == "Member server"
      ansible.builtin.debug:
        msg:
          - "Warning!! This run is connected as a local account over a network logon transport."
          - "WN22-MS-000020 sets LocalAccountTokenFilterPolicy=0, which filters the privileged token"
          - "of local accounts on network logon and would sever this connection mid-run."
          - "It is skipped automatically. Connect with a domain account, or over SSH, to have it"
          - "applied - a domain account is exempt and SSH does not use that logon path."

    - name: "PRELIM | Control Connection Scope | Set WN22-MS-000020 warning count"
      when:
        - prelim_local_account_network_logon | bool
        - ansible_facts['windows_domain_role'] == "Member server"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: 'WN22-MS-000020'

    - name: "PRELIM | Control Connection Scope | Warn that WN22-MS-000080 is skipped to keep the connection"
      when:
        - prelim_control_account_is_local | bool
        - ansible_facts['windows_domain_role'] == "Member server"
      ansible.builtin.debug:
        msg:
          - "Warning!! This run is connected as a local account on a domain joined member server."
          - "WN22-MS-000080 denies network logon to Guests, Enterprise Admins, Domain Admins, Local"
          - "account and Local account and member of Administrators group. That removes this"
          - "account's network logon right and severs the run. It takes BOTH transports with it:"
          - "Windows OpenSSH password authentication uses the same logon path, so SSH is reset at"
          - "the first auth packet and is not a fallback. The host is then reachable only from the"
          - "console. It is skipped automatically. To have it applied, connect as a domain account"
          - "that is NOT a Domain Admin or Enterprise Admin - those two are denied by this control"
          - "as well - and that IS a member of the local Administrators group on the target."

    - name: "PRELIM | Control Connection Scope | Set WN22-MS-000080 warning count"
      when:
        - prelim_control_account_is_local | bool
        - ansible_facts['windows_domain_role'] == "Member server"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: 'WN22-MS-000080'

# Windows Server 2022 ships a different optional feature set depending on installation type and role. win_feature
# raises "The role, role service, or feature name is not valid" for a name the OS does not know,
# which aborts the play on a control whose requirement is already trivially met. Enumerate the
# valid names once and gate the removals on membership.
- name: "PRELIM | Get Valid Windows Feature Names"
  tags: always
  ansible.windows.win_shell: Get-WindowsFeature | Select-Object -ExpandProperty Name
  changed_when: false
  failed_when: false
  check_mode: false
  register: prelim_windows_features

- name: "PRELIM | Set Fact For Valid Windows Feature Names"
  tags: always
  ansible.builtin.set_fact:
    prelim_feature_names: "{{ prelim_windows_features.stdout_lines | default([], true) | map('trim') | select | list }}"

# The per-user control loops the hives mounted under HKEY_USERS, so a profile whose owner is not
# signed in is invisible to it and the control can only warn about it. Load the Default profile
# and every profile listed in ProfileList so the control covers them, and release them again at
# the end of the run.
#
# Nothing here fails the run. A hive locked by a signed-in user, or a profile directory without an
# NTUSER.DAT, is skipped and simply does not get mounted.
#
# Domain controllers are excluded. A controller's ProfileList carries domain administrator
# profiles, and mounting and releasing those on a live controller is a materially different
# proposition from a member server. The exclusion is deliberate and untested rather than an
# assumption that it would work.
- name: "PRELIM | Load the Default and per-user registry hives"
  when:
    - win22stig_load_user_hives | bool
    - not ansible_check_mode
    - "'controller' not in ansible_facts['windows_domain_role'] | default('', true)"
  tags: always
  block:
    - name: "PRELIM | Record the hives loaded before the role loads any"
      ansible.windows.win_shell: (Get-ChildItem "REGISTRY::HKEY_USERS").name | Where-Object {$_ -notlike "*_classes"}
      changed_when: false
      failed_when: false
      check_mode: false
      register: prelim_hku_baseline

    - name: "PRELIM | Set fact for the hives already loaded"
      # The baseline the unload step subtracts, so a hive that was already mounted is left alone.
      ansible.builtin.set_fact:
        discovered_hku_preloaded_list: "{{ prelim_hku_baseline.stdout | regex_replace('HKEY_USERS\\\\', '') | split }}"

    - name: "PRELIM | Load the Default user hive"
      # The profile every new account is created from, so settings written here are inherited.
      ansible.windows.win_command: REG LOAD HKU\DEFAULT C:\Users\Default\NTUSER.DAT
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "PRELIM | Enumerate user profiles from ProfileList"
      # ProfileList, not Win32_UserAccount. Win32_UserAccount returns local accounts only, so a
      # domain account with a profile on this machine is missed entirely, and the per-user control
      # then leaves its hive unread. The benchmark's ntuser checks read every profile directory,
      # so a missed profile is a finding.
      #
      # ProfileImagePath is also the real location: it must not be assumed to be
      # C:\Users\<account name>, which is wrong whenever a profile was renamed or created against
      # a name collision.
      ansible.windows.win_shell: |
        Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList" |
          ForEach-Object {
            $sid  = $_.PSChildName
            $path = (Get-ItemProperty $_.PSPath -Name ProfileImagePath -EA SilentlyContinue).ProfileImagePath
            if ($sid -like 'S-1-5-21-*' -and $path -and (Test-Path "$path\NTUSER.DAT")) {
              "$sid|$path"
            }
          }
      changed_when: false
      failed_when: false
      check_mode: false
      register: prelim_user_profiles

    - name: "PRELIM | Set fact for user profile SIDs and paths"
      # Filtered on S-1-5-21-* so the service SIDs (S-1-5-18/19/20) are left alone, and on
      # NTUSER.DAT existing so a stale ProfileList entry cannot produce a failed REG LOAD.
      ansible.builtin.set_fact:
        discovered_user_profile_list: "{{ prelim_user_profiles.stdout_lines | default([], true) | map('trim') | select | map('split', '|') | list }}"

    - name: "PRELIM | Load each user hive by SID"
      ansible.windows.win_command: REG LOAD HKU\{{ item.0 }} "{{ item.1 }}\NTUSER.DAT"
      changed_when: false
      failed_when: false
      check_mode: false
      loop: "{{ discovered_user_profile_list }}"
