---

# Unload the registry hives that prelim.yml loaded, and only those.
#
# The set is computed rather than assumed: a hive that was already mounted when the role started
# must be left alone, or a signed-in user loses their profile mid-session.
#
# The whole file is guarded on check mode, and the guard lives here rather than at each call
# site so a future caller cannot forget it. prelim.yml does not load hives under --check, so
# the baseline facts this subtraction depends on are never set; the expression then collapses
# to "every mounted hive named DEFAULT", and a --check run unloads a hive it did not mount.

- name: "UNLOAD | Release the hives this role mounted"
  when: not ansible_check_mode
  tags: always
  block:
    - name: "UNLOAD | List the hives currently loaded"
      tags: always
      ansible.windows.win_shell: (Get-ChildItem "REGISTRY::HKEY_USERS").name | Where-Object {$_ -notlike "*_classes"}
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_hku_current

    - name: "UNLOAD | Set fact for the hives loaded by this role"
      tags: always
      ansible.builtin.set_fact:
        discovered_hku_role_loaded_list: "{{ (discovered_hku_current.stdout | regex_replace('HKEY_USERS\\\\', '') | split)
          | intersect(['DEFAULT'] + (discovered_user_profile_list | default([]) | map(attribute=0) | list))
          | difference(discovered_hku_preloaded_list | default([]) | difference(['DEFAULT'])) }}"

    - name: "UNLOAD | Unload the hives loaded by this role"
      # The garbage collection is load bearing. A lingering handle on the hive makes REG UNLOAD fail,
      # and it fails quietly, leaving the profile mounted until the next reboot.
      when: discovered_hku_role_loaded_list | length > 0
      tags: always
      ansible.windows.win_shell: |
        [gc]::Collect()
        [gc]::WaitForPendingFinalizers()
        REG UNLOAD HKU\{{ item }}
      changed_when: false
      failed_when: false
      check_mode: false
      loop: "{{ discovered_hku_role_loaded_list }}"
      register: discovered_hku_unload_results

    - name: "UNLOAD | Warn about hives that could not be unloaded"
      when: discovered_hku_unload_results.results | default([]) | selectattr('rc', 'ne', 0) | list | length > 0
      tags: always
      vars:
        warn_control_id: Hive_Unload_Failed
      block:
        - name: "UNLOAD | Warn about hives that could not be unloaded | Message"
          ansible.builtin.debug:
            msg:
              - "Warning!! The following user hives were loaded by this role and could not be unloaded:"
              - "{{ discovered_hku_unload_results.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"

        - name: "UNLOAD | Warn about hives that could not be unloaded | Warning Count"
          ansible.builtin.import_tasks:
            file: warning_facts.yml
